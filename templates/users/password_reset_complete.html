{% extends 'base.html' %}
{% block title %}Şifre Değiştirildi | Nishdot{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-80px)] bg-zinc-900 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Neon Glow Background -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-brand-pink/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="max-w-md w-full space-y-8 relative bg-zinc-800/30 p-10 rounded-2xl border border-white/5 shadow-[0_8px_30px_rgb(0,0,0,0.8)] backdrop-blur-md text-center">
        
        <div class="w-16 h-16 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-green-500/30">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>

        <h2 class="mt-2 text-3xl font-extrabold text-white">
            Şifre Değiştirildi!
        </h2>
        
        <div class="mt-4 text-zinc-400 space-y-4">
            <p>
                Şifreniz başarıyla güncellendi. Artık yeni şifrenizle sistemimize giriş yapabilirsiniz.
            </p>
        </div>

        <div class="pt-8">
            <a href="{% url 'users:login' %}" class="w-full btn-primary py-3 flex justify-center inline-block">
                Giriş Yap
            </a>
        </div>
    </div>
</div>
{% endblock %}
