<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Yeni İletişim Formu Mesajı</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f5;
            margin: 0;
            padding: 0;
            color: #27272a;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .header {
            background-color: #18181b;
            padding: 30px;
            text-align: center;
            border-bottom: 4px solid #EB596D;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .content {
            padding: 40px 30px;
        }
        .greeting {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        .details-box {
            background-color: #fce7eb;
            border-left: 4px solid #EB596D;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 4px;
        }
        .detail-row {
            margin-bottom: 10px;
        }
        .detail-label {
            font-weight: bold;
            color: #18181b;
            display: inline-block;
            width: 100px;
        }
        .message-content {
            background-color: #f4f4f5;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
            border: 1px solid #e4e4e7;
        }
        .footer {
            background-color: #18181b;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #a1a1aa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>NISHDOT</h1>
        </div>
        <div class="content">
            <div class="greeting">Yeni İletişim Formu Mesajı</div>
            
            <div class="details-box">
                <div class="detail-row">
                    <span class="detail-label">Gönderen:</span> {{ full_name }}
                </div>
                <div class="detail-row">
                    <span class="detail-label">E-Posta:</span> <a href="mailto:{{ sender_email }}" style="color: #EB596D;">{{ sender_email }}</a>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Konu:</span> {{ subject }}
                </div>
            </div>
            
            <div class="message-content">{{ message }}</div>
            
        </div>
        <div class="footer">
            Bu e-posta nishdot-web.com iletişim formu üzerinden otomatik gönderilmiştir.
        </div>
    </div>
</body>
</html>
