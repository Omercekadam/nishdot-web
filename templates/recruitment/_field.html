<div>
    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-zinc-300 mb-2">{{ field.label }}{% if field.field.required %} <span class="text-brand-pink">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="text-xs text-zinc-500 mt-1">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="text-red-400 text-xs mt-1">{{ error }}</p>{% endfor %}
</div>
