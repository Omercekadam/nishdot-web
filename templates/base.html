{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}İstanbul Nişantaşı Üniversitesi Dijital Oyun Tasarımı Kulübü{% endblock %}">

    <title>{% block title %}Home{% endblock %} | Nishdot</title>
    
    <!-- Favicon (Sekme İkonu) -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (Derlenmiş Output) -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-zinc-900 text-zinc-100 font-sans antialiased min-h-screen flex flex-col">
    
    {% include 'components/navbar.html' %}

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    {% include 'components/footer.html' %}

    <style>
        @keyframes nish-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-nish-spin {
            animation: nish-spin 1s linear infinite;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const progressiveForms = document.querySelectorAll('.progressive-form');
            
            progressiveForms.forEach(form => {
                form.addEventListener('submit', (e) => {
                    if (!form.checkValidity()) return;

                    const submitBtn = form.querySelector('button[type="submit"]');
                    if (!submitBtn) return;

                    // Çift gönderimi engelle
                    if (submitBtn.dataset.isSubmitting === 'true') {
                        e.preventDefault();
                        return;
                    }
                    submitBtn.dataset.isSubmitting = 'true';
                    submitBtn.classList.add('cursor-wait', 'opacity-90');

                    const originalText = submitBtn.innerText.trim();
                    const spinnerSvg = `<svg class="animate-nish-spin -ml-1 mr-2 h-5 w-5 text-white inline-block shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>`;

                    // 1 Saniye: Sadece Spinner
                    setTimeout(() => {
                        submitBtn.innerHTML = `<div class="flex items-center justify-center">${spinnerSvg}<span>${originalText}</span></div>`;
                    }, 1000);

                    // 2+ Saniye: Spinner + Bekleme Mesajı
                    setTimeout(() => {
                        submitBtn.innerHTML = `<div class="flex items-center justify-center">${spinnerSvg}<span>Lütfen bekleyin...</span></div>`;
                    }, 2500);
                });
            });
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
