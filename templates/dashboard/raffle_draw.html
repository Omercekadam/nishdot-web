{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}Canlı Kura - {{ raffle.title }}{% endblock %}

{% block dashboard_content %}
<div class="fixed inset-0 bg-zinc-950 z-[100] flex flex-col items-center justify-center overflow-hidden font-sans">
    <!-- Kapat -->
    <a href="{% url 'dashboard:raffles' %}" class="absolute top-6 left-6 text-zinc-400 hover:text-white transition-colors z-[110] flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="inline-block w-[1em] h-[1em] align-middle shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg> Yönetime Dön
    </a>

    <!-- Arka plan efektleri -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden" id="bgEffects">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-zinc-900 via-zinc-950 to-black"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-[500px] bg-brand-pink/5 blur-[100px] rounded-full transition-all duration-1000" id="glowEffect"></div>
    </div>

    <!-- Katılımcı Sayaç -->
    <div class="absolute top-4 right-4 md:top-8 md:right-8 text-right z-10 bg-zinc-900/80 backdrop-blur border border-zinc-800 px-4 md:px-6 py-2 md:py-3 rounded-2xl">
        <p class="text-zinc-500 text-[10px] md:text-xs font-bold uppercase tracking-widest">Kura Torbası</p>
        <p class="text-2xl md:text-3xl font-black text-white"><span id="participantCount">0</span> <span class="text-sm md:text-lg text-zinc-400 font-medium">kişi</span></p>
    </div>

    <div class="relative z-10 w-full max-w-4xl mx-auto text-center px-4 flex flex-col items-center pt-16 md:pt-0">
        <img src="{% static 'images/nishdotlogolightpng.webp' %}" alt="Nishdot Logo" class="h-24 md:h-32 object-contain mb-8">
        
        <h2 class="text-xl md:text-2xl text-brand-pink font-bold tracking-widest uppercase mb-2">{{ raffle.title }}</h2>
        <p class="text-sm md:text-base text-zinc-400 mb-8 md:mb-12">{{ raffle.event.title }}</p>

        <!-- Slot Makinesi / İsim Ekranı -->
        <div class="w-full max-w-3xl h-32 md:h-48 relative overflow-hidden flex items-center justify-center mb-8 md:mb-12" id="slotContainer">
            <div id="nameDisplay" class="text-4xl md:text-7xl font-black text-white text-center w-full px-4 truncate transition-transform duration-75">
                <span class="text-zinc-600">Hazır...</span>
            </div>
        </div>

        <!-- Butonlar -->
        <div class="flex gap-4">
            <button id="drawBtn" class="bg-brand-pink hover:bg-opacity-90 text-white font-black text-lg md:text-2xl px-8 md:px-12 py-4 md:py-5 rounded-2xl shadow-[0_0_40px_rgba(235,89,109,0.4)] hover:shadow-[0_0_60px_rgba(235,89,109,0.6)] hover:scale-105 transition-all focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="inline-block w-[1em] h-[1em] align-middle shrink-0 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z"/></svg> ÇEKİLİŞİ BAŞLAT
            </button>
            <button id="resetBtn" class="hidden bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-base md:text-lg px-6 md:px-8 py-4 md:py-5 rounded-2xl transition-all focus:outline-none">
                Yeni Kura
            </button>
        </div>
        
        <div id="errorMsg" class="text-red-500 font-bold mt-6 hidden"></div>
    </div>
    
    <!-- Confetti -->
    <canvas id="confetti" class="absolute inset-0 pointer-events-none w-full h-full z-50"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" integrity="sha384-HAH79XdRvHr6axVGh4xQWVCp14kcd32bNk4Xu0sHDHtFQ42n6BAM8ykvB47dGz6D" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
    const csrfToken = '{{ csrf_token }}';
    const participantsUrl = "{% url 'dashboard:api_raffle_participants' raffle.id %}";
    const pickWinnerUrl = "{% url 'dashboard:api_raffle_pick_winner' raffle.id %}";
    const closeRaffleUrl = "{% url 'dashboard:api_raffle_toggle' raffle.id %}";

    let participants = [];
    let isDrawing = false;
    let updateInterval;

    const countDisplay = document.getElementById('participantCount');
    const nameDisplay = document.getElementById('nameDisplay');
    const drawBtn = document.getElementById('drawBtn');
    const resetBtn = document.getElementById('resetBtn');
    const glowEffect = document.getElementById('glowEffect');
    const errorMsg = document.getElementById('errorMsg');

    // Katılımcıları Çek
    async function fetchParticipants() {
        if(isDrawing) return;
        try {
            const res = await fetch(participantsUrl);
            const data = await res.json();
            participants = data.participants;
            countDisplay.innerText = data.count;
        } catch(e) {
            console.error("Katılımcılar alınamadı");
        }
    }

    // İlk yükleme ve periyodik güncelleme
    fetchParticipants();
    updateInterval = setInterval(fetchParticipants, 3000);

    drawBtn.addEventListener('click', async () => {
        if(isDrawing) return;
        
        if(participants.length === 0) {
            errorMsg.innerText = "Henüz katılımcı yok!";
            errorMsg.classList.remove('hidden');
            return;
        }
        
        isDrawing = true;
        errorMsg.classList.add('hidden');
        clearInterval(updateInterval); // Çekiliş sırasında güncellemeyi durdur
        
        // Çekilişi kapat ki çekiliş anında yeni biri katılmasın
        await fetch(closeRaffleUrl, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
            body: JSON.stringify({is_active: false})
        });
        
        drawBtn.classList.add('hidden');
        nameDisplay.classList.remove('text-brand-pink', 'scale-110');
        glowEffect.classList.remove('bg-brand-pink/20');
        glowEffect.classList.add('bg-zinc-800/50');
        
        // Sunucudan kazananı iste
        let winnerName = "";
        try {
            const res = await fetch(pickWinnerUrl, {
                method: 'POST',
                headers: {'X-CSRFToken': csrfToken}
            });
            const data = await res.json();
            if(data.success) {
                winnerName = data.winner;
            } else {
                errorMsg.innerText = data.error;
                errorMsg.classList.remove('hidden');
                isDrawing = false;
                drawBtn.classList.remove('hidden');
                return;
            }
        } catch(e) {
            errorMsg.innerText = "Bağlantı hatası!";
            errorMsg.classList.remove('hidden');
            isDrawing = false;
            drawBtn.classList.remove('hidden');
            return;
        }

        // Slot animasyonu
        let duration = 5000; // 5 saniye dönecek
        let startTime = Date.now();
        let speed = 50; // Başlangıç hızı
        
        function animateSlot() {
            let now = Date.now();
            let elapsed = now - startTime;
            
            if (elapsed < duration) {
                // Rastgele isim göster
                const randomParticipant = participants[Math.floor(Math.random() * participants.length)];
                nameDisplay.innerText = randomParticipant.name || "Bilinmiyor";
                
                // Yavaşlama efekti (exponential delay)
                let progress = elapsed / duration;
                let currentDelay = speed + (progress * progress * 300);
                
                // Renkleri titret
                if(Math.random() > 0.8) {
                    nameDisplay.classList.add('text-zinc-300');
                    nameDisplay.classList.remove('text-white');
                } else {
                    nameDisplay.classList.add('text-white');
                    nameDisplay.classList.remove('text-zinc-300');
                }
                
                setTimeout(animateSlot, currentDelay);
            } else {
                // Final
                nameDisplay.innerText = winnerName;
                nameDisplay.classList.add('text-brand-pink', 'scale-110');
                
                glowEffect.classList.remove('bg-zinc-800/50');
                glowEffect.classList.add('bg-brand-pink/30', 'scale-150');
                
                fireConfetti();
                
                resetBtn.classList.remove('hidden');
                isDrawing = false;
            }
        }
        
        animateSlot();
    });

    resetBtn.addEventListener('click', () => {
        resetBtn.classList.add('hidden');
        drawBtn.classList.remove('hidden');
        nameDisplay.innerText = "Hazır...";
        nameDisplay.className = "text-5xl md:text-7xl font-black text-white text-center w-full px-4 truncate transition-all duration-300";
        glowEffect.classList.remove('bg-brand-pink/30', 'scale-150');
        glowEffect.classList.add('bg-brand-pink/5');
        updateInterval = setInterval(fetchParticipants, 3000);
    });

    function fireConfetti() {
        var duration = 5 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 45, spread: 360, ticks: 100, zIndex: 1000 };

        function randomInRange(min, max) { return Math.random() * (max - min) + min; }

        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);

            var particleCount = 100 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }
</script>
{% endblock %}
